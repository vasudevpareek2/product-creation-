services:
  - type: web
    name: product-creation-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start_backend.py
    envVars:
      - key: PORT
        value: 8000
    region: oregon
    healthCheckPath: /docs
    workingDir: backend
  - type: web
    name: product-creation-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://product-creation-backend.onrender.com
    region: oregon
    workingDir: frontend-new