services:
  - type: web
    name: product-creation-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: "uploads"
      - key: CONFIG_DIR
        value: "config"
      - key: LOG_DIR
        value: "logs"
    region: oregon
    healthCheckPath: /docs