services:
  - type: web
    name: product-creation-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start_backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8000
    region: oregon
    healthCheckPath: /docs